[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retroimg"
dynamic = ["version"]
description = "Convert modern images to constrained retro display palettes and geometries."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
guided = ["prompt-toolkit>=3.0.43,<4"]
dev = ["pytest>=8", "build>=1.2"]
bundle = ["pyinstaller>=6,<7"]

[tool.setuptools.dynamic]
version = {attr = "retroimg.__version__"}

[project.scripts]
retroimg = "retroimg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["retroimg*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
