name: Desktop GUI test builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gui.yml'
      - 'retroimg/**'
      - 'tests/**'
      - 'scripts/build_portable.py'
      - 'scripts/check_gui.py'
      - 'scripts/retroimg_gui_entry.py'
      - 'pyproject.toml'
      - 'docs/gui.md'
  pull_request:
    paths:
      - 'retroimg/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/gui.yml'

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install desktop and test dependencies
        run: python -m pip install -e ".[dev,gui,bundle]"
      - name: Install Linux Qt runtime and X11 build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0
      - name: Run regression and desktop tests
        run: python -m pytest -q
      - name: Build native desktop application
        run: python scripts/build_portable.py --gui --output-dir dist/gui
      - name: Check extracted desktop application outside checkout
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          archive = next(Path('dist/gui').glob('*.zip'))
          subprocess.run([sys.executable, 'scripts/check_gui.py', str(archive)], check=True)
      - uses: actions/upload-artifact@v7
        with:
          name: retroimg-gui-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/gui/*.zip
            dist/gui/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
