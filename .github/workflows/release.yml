name: Prepare draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
        default: v0.2.0

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: '1'

jobs:
  build:
    name: Build ${{ matrix.frontend }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            frontend: gui
            extra: dev,guided,gui,bundle
          - os: windows-latest
            frontend: gui
            extra: dev,guided,gui,bundle
          - os: windows-latest
            frontend: cli
            extra: dev,guided,bundle
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify version tag and release notes
        run: python scripts/prepare_release.py --tag "$RELEASE_TAG" --check-only
        shell: bash
      - name: Install application and build dependencies
        run: python -m pip install -e ".[${{ matrix.extra }}]"
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build and check native release ZIP
        shell: python
        env:
          FRONTEND: ${{ matrix.frontend }}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          gui = os.environ['FRONTEND'] == 'gui'
          command = [sys.executable, 'scripts/build_portable.py', '--release', '--output-dir', 'dist/release']
          if gui:
              command.append('--gui')
          subprocess.run(command, check=True)
          archive = next(Path('dist/release').glob('*.zip'))
          checker = 'scripts/check_gui.py' if gui else 'scripts/check_portable.py'
          subprocess.run([sys.executable, checker, str(archive)], check=True)
      - uses: actions/upload-artifact@v7
        with:
          path: dist/release/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Assemble draft preview release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: retroimg-*.zip
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Verify complete release and calculate checksums
        shell: bash
        run: python scripts/prepare_release.py --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
      - name: Create or update draft preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > release-state.txt; then
            if [ "$(cat release-state.txt)" != true ]; then
              echo 'This release is already published; refusing to replace its assets.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false \
              --title "RetroIMG $RELEASE_TAG — preview" --notes-file "$notes"
          fi
